<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree Maker</title>
<link rel="stylesheet" href="style.css">
<!-- Must run before first paint to avoid a flash of the wrong theme -->
<script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Tree Maker</h1>
    <div class="topbar-actions">
      <button id="theme-btn" class="icon-btn" type="button" aria-label="Switch to light theme" title="Switch to light theme">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
      <button id="reset-btn" class="danger">Reset Tree</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <div id="sidebar-content"></div>
    </aside>

    <main>
      <div id="canvas-container">
        <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <section id="export-section">
        <div class="export-header">
          <h2>ASCII Output</h2>
          <div>
            <button id="generate-btn">Generate</button>
            <button id="copy-btn">Copy</button>
          </div>
        </div>
        <pre id="ascii-output" class="ascii-output"></pre>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
